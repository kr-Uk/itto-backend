spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:itto}
    username: ${DB_USER:itto}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT:classpath:firebase-service-account.json}

jwt:
  secret: ${JWT_SECRET:itto-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiry: ${JWT_ACCESS_EXPIRY:1800000}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:2592000000}

server:
  port: 80
