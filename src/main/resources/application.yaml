spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:itto}
    username: ${DB_USER:itto}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT:classpath:firebase-service-account.json}

oauth:
  google-client-id: ${GOOGLE_CLIENT_ID:}
  apple-client-id: ${APPLE_CLIENT_ID:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:itto}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 30MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_EXPIRY:1800000}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:2592000000}

itto:
  payment:
    skip-receipt-validation: ${SKIP_RECEIPT_VALIDATION:false}
  store-api:
    apple:
      base-url: ${APPLE_STORE_API_BASE_URL:https://api.storekit.itunes.apple.com}
      issuer-id: ${APPLE_STORE_API_ISSUER_ID:}
      key-id: ${APPLE_STORE_API_KEY_ID:}
      private-key-path: ${APPLE_STORE_API_PRIVATE_KEY_PATH:}
      bundle-id: ${APPLE_BUNDLE_ID:}
    google:
      base-url: ${GOOGLE_PLAY_API_BASE_URL:https://androidpublisher.googleapis.com}
      service-account-key-path: ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:}
      package-name: ${GOOGLE_PACKAGE_NAME:}

server:
  port: 80

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  paths-to-match: /api/v1/**
