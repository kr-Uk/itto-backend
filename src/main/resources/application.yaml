spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:itto}
    username: ${DB_USER:itto}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT:classpath:firebase-service-account.json}

oauth:
  google-client-id: ${GOOGLE_CLIENT_ID:}
  apple-client-id: ${APPLE_CLIENT_ID:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:itto}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 30MB

jwt:
  secret: ${JWT_SECRET:itto-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiry: ${JWT_ACCESS_EXPIRY:1800000}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:2592000000}

itto:
  payment:
    skip-receipt-validation: ${SKIP_RECEIPT_VALIDATION:false}

nice:
  client-id: ${NICE_CLIENT_ID:}
  client-secret: ${NICE_CLIENT_SECRET:}
  product-id: ${NICE_PRODUCT_ID:}
  access-token-url: ${NICE_ACCESS_TOKEN_URL:https://svc.niceapi.co.kr:22001/digital/niceid/oauth/oauth/token}
  crypto-token-url: ${NICE_CRYPTO_TOKEN_URL:https://svc.niceapi.co.kr:22001/digital/niceid/api/v1.0/common/crypto/token}
  return-url: ${NICE_RETURN_URL:https://api.hguitto.site/api/v1/identity/callback/success}
  error-url: ${NICE_ERROR_URL:https://api.hguitto.site/api/v1/identity/callback/fail}

server:
  port: 80

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  paths-to-match: /api/v1/**
